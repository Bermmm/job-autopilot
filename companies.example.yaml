# Which public job boards to poll.
#
# Copy to companies.yaml and prune to the companies you actually care about:
#   cp companies.example.yaml companies.yaml
#
# Only sources with a documented public JSON API or feed belong here. This
# project does not scrape LinkedIn, Indeed, or anywhere else whose terms
# forbid it — that is a design decision, not a missing feature.
#
# The board token is the slug in the public URL:
#   greenhouse  job-boards.greenhouse.io/<token>   → boards-api.greenhouse.io/v1/boards/<token>/jobs
#   lever       jobs.lever.co/<token>              → api.lever.co/v0/postings/<token>?mode=json
#   ashby       jobs.ashbyhq.com/<token>           → api.ashbyhq.com/posting-api/job-board/<token>
#
# Every token below was confirmed live against its API. They do go stale as
# companies switch providers, so a 404 from one board is normal and `hunt`
# reports it per board rather than failing the run. Note that far fewer
# companies use Lever than Greenhouse or Ashby, and a wrong Lever token
# returns 404 rather than an empty list.
#
# For scale: these 20 boards carry ~5,000 open postings, of which roughly 150
# are newer than 48 hours on any given day. That is the volume `hunt` is
# tuned for. Cut the list down and your runs get quieter; a single company
# will often legitimately return nothing.

boards:
  # --- greenhouse ---
  - source: greenhouse
    token: stripe
    name: Stripe

  - source: greenhouse
    token: databricks
    name: Databricks

  - source: greenhouse
    token: cloudflare
    name: Cloudflare

  - source: greenhouse
    token: coinbase
    name: Coinbase

  - source: greenhouse
    token: gitlab
    name: GitLab

  - source: greenhouse
    token: reddit
    name: Reddit

  - source: greenhouse
    token: pinterest
    name: Pinterest

  - source: greenhouse
    token: twilio
    name: Twilio

  - source: greenhouse
    token: asana
    name: Asana

  - source: greenhouse
    token: instacart
    name: Instacart

  - source: greenhouse
    token: dropbox
    name: Dropbox

  - source: greenhouse
    token: discord
    name: Discord

  - source: greenhouse
    token: figma
    name: Figma

  # --- lever ---
  - source: lever
    token: spotify
    name: Spotify

  # --- ashby ---
  - source: ashby
    token: openai
    name: OpenAI

  - source: ashby
    token: notion
    name: Notion

  - source: ashby
    token: ramp
    name: Ramp

  - source: ashby
    token: supabase
    name: Supabase

  - source: ashby
    token: modal
    name: Modal

  - source: ashby
    token: linear
    name: Linear

  # Set enabled: false to park a company without deleting the entry.
  - source: greenhouse
    token: airtable
    name: Airtable
    enabled: false

  # Optional filter: skip a board's postings unless the title matches. Matching
  # is case-insensitive substring, applied before anything is stored — so it
  # also keeps those postings out of the scoring bill.
  #
  # - source: greenhouse
  #   token: stripe
  #   name: Stripe
  #   titleIncludes:
  #     - engineer
  #     - developer

# Optional RSS / Atom / JSON feeds, for job boards that publish one.
# Leave empty if you have none.
feeds: []
  # - name: Example Jobs Feed
  #   url: https://example.com/jobs.rss
  #   format: rss
